spring.application.name=plataformas-api

# Banco padrão: H2 em arquivo (pasta ./data). Não precisa instalar nada e os dados persistem.
# Para usar PostgreSQL, rode com o perfil "postgres" (veja application-postgres.properties).
spring.datasource.url=jdbc:h2:file:./data/artemis;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Chave HMAC do JWT (mínimo 32 caracteres). Em produção, defina a variável JWT_SECRET.
app.jwt.secret=${JWT_SECRET:troque-esta-chave-em-producao-0123456789}
app.jwt.expiracao-minutos=120

# Usuários criados na primeira execução (apenas para desenvolvimento)
app.seed.admin-email=admin@artemis.com
app.seed.admin-senha=admin123
app.seed.comum-email=comum@artemis.com
app.seed.comum-senha=comum123
